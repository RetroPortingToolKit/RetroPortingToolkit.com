<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-label="The six stages of a port, with what each stage produces, and the cycle from verification back to discovery.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #7c7c82; }
    .t { font-size: 14px; font-weight: 600; }
    .n { font-size: 12.5px; font-weight: 600; }
    .s { font-size: 12.5px; }
    .m { font-size: 11.5px; }
    .box { fill: none; stroke: #7c7c82; stroke-width: 1.25; }
    .ln { fill: none; stroke: #7c7c82; stroke-width: 1.25; }
    .dl { fill: none; stroke: #7c7c82; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="6.8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L6.6 4 L1 7" fill="none" stroke="#7c7c82" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="m" x="88" y="22">Before stage 1, once: the toolchain for your console is built.</text>

  <text class="s" x="213" y="48" text-anchor="middle">your own dump</text>
  <line class="ln" x1="213" y1="56" x2="213" y2="70" marker-end="url(#ar)"/>

  <!-- stage 1 -->
  <rect class="box" x="88" y="72" width="250" height="46"/>
  <text class="n" x="102" y="92">1</text>
  <text class="t" x="122" y="92">The file you supply</text>
  <text class="m" x="122" y="108">a dump this exact port recognises</text>
  <line class="ln" x1="338" y1="95" x2="357" y2="95" marker-end="url(#ar)"/>
  <text class="s" x="364" y="99">a verified file and an identity record</text>
  <line class="ln" x1="213" y1="118" x2="213" y2="132" marker-end="url(#ar)"/>

  <!-- stage 2 -->
  <rect class="box" x="88" y="134" width="250" height="46"/>
  <text class="n" x="102" y="154">2</text>
  <text class="t" x="122" y="154">Discovery</text>
  <text class="m" x="122" y="170">which bytes are instructions</text>
  <line class="ln" x1="338" y1="157" x2="357" y2="157" marker-end="url(#ar)"/>
  <text class="s" x="364" y="161">the set of function entry points</text>
  <line class="ln" x1="213" y1="180" x2="213" y2="194" marker-end="url(#ar)"/>

  <!-- stage 3 -->
  <rect class="box" x="88" y="196" width="250" height="46"/>
  <text class="n" x="102" y="216">3</text>
  <text class="t" x="122" y="216">Translation</text>
  <text class="m" x="122" y="232">one C function per function found</text>
  <line class="ln" x1="338" y1="219" x2="357" y2="219" marker-end="url(#ar)"/>
  <text class="s" x="364" y="223">generated C and a dispatch table</text>
  <line class="ln" x1="213" y1="242" x2="213" y2="256" marker-end="url(#ar)"/>

  <!-- stage 4 -->
  <rect class="box" x="88" y="258" width="250" height="46"/>
  <text class="n" x="102" y="278">4</text>
  <text class="t" x="122" y="278">Compilation</text>
  <text class="m" x="122" y="294">with the runtime and per-game shims</text>
  <line class="ln" x1="338" y1="281" x2="357" y2="281" marker-end="url(#ar)"/>
  <text class="s" x="364" y="285">a native executable</text>
  <line class="ln" x1="213" y1="304" x2="213" y2="318" marker-end="url(#ar)"/>

  <!-- stage 5 -->
  <rect class="box" x="88" y="320" width="250" height="46"/>
  <text class="n" x="102" y="340">5</text>
  <text class="t" x="122" y="340">Verification</text>
  <text class="m" x="122" y="356">dispatch misses, then co-simulation</text>
  <line class="ln" x1="338" y1="343" x2="357" y2="343" marker-end="url(#ar)"/>
  <text class="s" x="364" y="347">a clean run, or a first divergence</text>
  <line class="ln" x1="213" y1="366" x2="213" y2="380" marker-end="url(#ar)"/>

  <!-- stage 6 -->
  <rect class="box" x="88" y="382" width="250" height="46"/>
  <text class="n" x="102" y="402">6</text>
  <text class="t" x="122" y="402">Enhancement</text>
  <text class="m" x="122" y="418">every one of them is off by default</text>
  <line class="ln" x1="338" y1="405" x2="357" y2="405" marker-end="url(#ar)"/>
  <text class="s" x="364" y="409">opt-in, default-off features</text>

  <!-- the loop: stage 5 back to stage 2 -->
  <path class="dl" d="M88 343 L30 343 L30 157 L82 157" marker-end="url(#ar)"/>
  <g transform="rotate(-90 46 250)">
    <text class="m" x="46" y="250" text-anchor="middle">stages 2 to 5 are a cycle:</text>
    <text class="m" x="46" y="264" text-anchor="middle">a dispatch miss found at 5</text>
    <text class="m" x="46" y="278" text-anchor="middle">becomes a seed at 2</text>
  </g>
</svg>
