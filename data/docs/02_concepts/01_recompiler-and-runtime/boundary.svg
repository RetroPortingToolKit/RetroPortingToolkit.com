<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-label="The build time and run time sides of a static recompilation project, and the four things that cross the header between them.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #7c7c82; }
    .h { font-size: 14px; font-weight: 600; }
    .s { font-size: 12.5px; }
    .m { font-size: 11.5px; }
    .k { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
    .k2 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .ln { fill: none; stroke: #7c7c82; stroke-width: 1.25; }
    .dl { fill: none; stroke: #7c7c82; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .rule { fill: none; stroke: #7c7c82; stroke-width: 1; stroke-opacity: 0.45; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="6.8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L6.6 4 L1 7" fill="none" stroke="#7c7c82" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="h" x="178" y="22" text-anchor="middle">The recompiler</text>
  <text class="m" x="178" y="40" text-anchor="middle">runs once, on a build machine, and writes C</text>

  <text class="h" x="542" y="22" text-anchor="middle">The runtime</text>
  <text class="m" x="542" y="40" text-anchor="middle">runs on a player's machine, every frame</text>

  <text class="k" x="360" y="62" text-anchor="middle">include/recomp.h</text>
  <text class="m" x="360" y="79" text-anchor="middle">the recompiler ships it, the runtime satisfies it</text>

  <line class="dl" x1="360" y1="90" x2="360" y2="148"/>
  <line class="dl" x1="360" y1="172" x2="360" y2="374"/>

  <!-- the artefact itself -->
  <text class="s" x="296" y="116" text-anchor="end">generated C, one function per file</text>
  <line class="ln" x1="306" y1="112" x2="414" y2="112" marker-end="url(#ar)"/>
  <text class="s" x="424" y="116">compiled and linked with the runtime</text>

  <line class="rule" x1="16" y1="140" x2="336" y2="140"/>
  <line class="rule" x1="384" y1="140" x2="704" y2="140"/>
  <text class="m" x="360" y="162" text-anchor="middle">four things cross</text>

  <!-- 1 -->
  <line class="ln" x1="306" y1="196" x2="414" y2="196" marker-end="url(#ar)"/>
  <text class="k" x="296" y="192" text-anchor="end">recomp_context</text>
  <text class="m" x="296" y="209" text-anchor="end">emitted as ctx-&gt;r4, ctx-&gt;f12.u32l</text>
  <text class="s" x="424" y="192">allocates it</text>
  <text class="m" x="424" y="209">and owns the thread that carries it</text>

  <!-- 2 -->
  <line class="ln" x1="306" y1="248" x2="414" y2="248" marker-end="url(#ar)"/>
  <text class="k" x="296" y="244" text-anchor="end">LOOKUP_FUNC(addr)</text>
  <text class="m" x="296" y="261" text-anchor="end">emitted for a jump through a register</text>
  <text class="s" x="424" y="244">implements <tspan class="k2">get_function</tspan></text>
  <text class="m" x="424" y="261">which the macro expands to</text>

  <!-- 3 -->
  <line class="ln" x1="306" y1="300" x2="414" y2="300" marker-end="url(#ar)"/>
  <text class="k" x="296" y="296" text-anchor="end">RELOC_HI16 / RELOC_LO16</text>
  <text class="m" x="296" y="313" text-anchor="end">for code loaded to a run-time address</text>
  <text class="s" x="424" y="296">maintains <tspan class="k2">section_addresses</tspan></text>
  <text class="m" x="424" y="313">one entry per code section</text>

  <!-- 4 -->
  <line class="ln" x1="306" y1="352" x2="414" y2="352" marker-end="url(#ar)"/>
  <text class="k" x="296" y="348" text-anchor="end">rdram</text>
  <text class="m" x="296" y="365" text-anchor="end">indexed by the load and store macros</text>
  <text class="s" x="424" y="348">owns the allocation</text>
  <text class="m" x="424" y="365">guest memory, as a raw byte pointer</text>
</svg>
