<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 422" role="img" aria-label="Three execution tiers tried in order, what falls through to each, and the capture and compile path that moves interpreted code up into the overlay cache.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #7c7c82; }
    .h { font-size: 14px; font-weight: 600; }
    .n { font-size: 14px; font-weight: 600; }
    .s { font-size: 12.5px; }
    .m { font-size: 11.5px; }
    .l { font-size: 11px; font-weight: 600; }
    .box { fill: none; stroke: #7c7c82; stroke-width: 1.25; }
    .ln { fill: none; stroke: #7c7c82; stroke-width: 1.25; }
    .dl { fill: none; stroke: #7c7c82; stroke-width: 1.25; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="6.8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L6.6 4 L1 7" fill="none" stroke="#7c7c82" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="s" x="330" y="22" text-anchor="middle">a control transfer</text>
  <line class="ln" x1="330" y1="28" x2="330" y2="44" marker-end="url(#ar)"/>

  <rect class="box" x="140" y="48" width="380" height="52"/>
  <text class="n" x="154" y="72">1</text>
  <text class="h" x="178" y="72">statically compiled code</text>
  <text class="m" x="178" y="90">everything the recompiler could see at build time</text>

  <line class="ln" x1="330" y1="100" x2="330" y2="136" marker-end="url(#ar)"/>
  <text class="m" x="340" y="124">code the disc streamed into RAM after the build</text>

  <rect class="box" x="140" y="140" width="380" height="70"/>
  <text class="n" x="154" y="164">2</text>
  <text class="h" x="178" y="164">the compiled native overlay cache</text>
  <text class="m" x="178" y="182">dispatched only while live RAM still holds</text>
  <text class="m" x="178" y="198">the bytes it was compiled from</text>

  <line class="ln" x1="330" y1="210" x2="330" y2="246" marker-end="url(#ar)"/>
  <text class="m" x="340" y="234">no cached variant, or live RAM no longer matches</text>

  <rect class="box" x="140" y="250" width="380" height="52"/>
  <text class="n" x="154" y="274">3</text>
  <text class="h" x="178" y="274">the interpreter</text>
  <text class="m" x="178" y="292">runs the code correctly, and more slowly</text>

  <line class="dl" x1="330" y1="302" x2="330" y2="330" marker-end="url(#ar)"/>
  <text class="m" x="340" y="320">the PCs it executed become seeds</text>

  <text class="l" x="16" y="328">what moves code up a tier</text>
  <rect class="dl" x="16" y="334" width="688" height="44"/>
  <text class="s" x="141" y="360" text-anchor="middle">captured at CD DMA</text>
  <line class="ln" x1="240" y1="356" x2="262" y2="356" marker-end="url(#ar)"/>
  <text class="s" x="360" y="360" text-anchor="middle">compiled out of process</text>
  <line class="ln" x1="459" y1="356" x2="481" y2="356" marker-end="url(#ar)"/>
  <text class="s" x="579" y="360" text-anchor="middle">cached by address and CRC</text>

  <path class="dl" d="M690 334 L690 175 L526 175" marker-end="url(#ar)"/>

  <text class="m" x="360" y="402" text-anchor="middle">the failure direction is always speed</text>
</svg>
