<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 474" role="img" aria-label="Two implementations stepped to the same guest cycle, each folding a whole-machine hash into a running chain, halting at the first checkpoint whose chains differ.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #7c7c82; }
    .h { font-size: 13.5px; font-weight: 600; }
    .s { font-size: 12.5px; font-weight: 600; }
    .cp { font-size: 12px; font-weight: 600; }
    .m { font-size: 11px; }
    .xs { font-size: 10.5px; }
    .k { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
    .v { font-size: 17px; font-weight: 600; }
    .box { fill: none; stroke: #7c7c82; stroke-width: 1.25; }
    .rung { fill: none; stroke: #7c7c82; stroke-width: 1.25; }
    .bad { fill: none; stroke: #cc4b45; stroke-width: 1.5; }
    .badt { fill: #cc4b45; }
  </style>

  <text class="h" x="170" y="26" text-anchor="middle">the recompiled build</text>
  <text class="m" x="170" y="44" text-anchor="middle">the code under test</text>

  <text class="h" x="550" y="26" text-anchor="middle">an interpreter, or an emulator</text>
  <text class="m" x="550" y="44" text-anchor="middle">pairing 1: the project's own interpreter</text>
  <text class="m" x="550" y="58" text-anchor="middle">pairing 2: an independent implementation</text>

  <text class="m" x="360" y="76" text-anchor="middle">both from the same reset</text>
  <line class="rung" x1="16" y1="82" x2="704" y2="82"/>
  <text class="m" x="360" y="100" text-anchor="middle">each side stops at a fixed cycle boundary, never at a wall-time point</text>

  <!-- checkpoint 1 -->
  <line class="rung" x1="16" y1="114" x2="704" y2="114"/>
  <text class="cp" x="24" y="136">cp 1</text>
  <text class="xs" x="24" y="150">cycle 4,096</text>
  <rect class="box" x="150" y="126" width="170" height="30"/>
  <text class="k" x="235" y="146" text-anchor="middle">chain …a41f</text>
  <text class="v" x="360" y="151" text-anchor="middle">=</text>
  <rect class="box" x="400" y="126" width="170" height="30"/>
  <text class="k" x="485" y="146" text-anchor="middle">chain …a41f</text>
  <text class="xs" x="582" y="134">each checkpoint folds</text>
  <text class="xs" x="582" y="148">the state hash into</text>
  <text class="xs" x="582" y="162">the running chain</text>

  <!-- checkpoint 2 -->
  <line class="rung" x1="16" y1="170" x2="704" y2="170"/>
  <text class="cp" x="24" y="192">cp 2</text>
  <text class="xs" x="24" y="206">cycle 8,192</text>
  <rect class="box" x="150" y="182" width="170" height="30"/>
  <text class="k" x="235" y="202" text-anchor="middle">chain …7b30</text>
  <text class="v" x="360" y="207" text-anchor="middle">=</text>
  <rect class="box" x="400" y="182" width="170" height="30"/>
  <text class="k" x="485" y="202" text-anchor="middle">chain …7b30</text>

  <!-- checkpoint 3 -->
  <line class="rung" x1="16" y1="226" x2="704" y2="226"/>
  <text class="cp" x="24" y="248">cp 3</text>
  <text class="xs" x="24" y="262">cycle 12,288</text>
  <rect class="box" x="150" y="238" width="170" height="30"/>
  <text class="k" x="235" y="258" text-anchor="middle">chain …c58e</text>
  <text class="v" x="360" y="263" text-anchor="middle">=</text>
  <rect class="box" x="400" y="238" width="170" height="30"/>
  <text class="k" x="485" y="258" text-anchor="middle">chain …c58e</text>

  <!-- checkpoint 4: the divergence -->
  <line class="rung" x1="16" y1="282" x2="704" y2="282"/>
  <text class="cp" x="24" y="304">cp 4</text>
  <text class="xs" x="24" y="318">cycle 16,384</text>
  <rect class="bad" x="150" y="294" width="170" height="30"/>
  <text class="k badt" x="235" y="314" text-anchor="middle">chain …9c02</text>
  <text class="v badt" x="360" y="319" text-anchor="middle">≠</text>
  <rect class="bad" x="400" y="294" width="170" height="30"/>
  <text class="k badt" x="485" y="314" text-anchor="middle">chain …3de7</text>

  <rect class="box" x="187" y="338" width="16" height="16"/>
  <rect class="box" x="207" y="338" width="16" height="16"/>
  <rect class="bad" x="227" y="338" width="16" height="16"/>
  <rect class="box" x="247" y="338" width="16" height="16"/>
  <rect class="box" x="267" y="338" width="16" height="16"/>

  <rect class="box" x="437" y="338" width="16" height="16"/>
  <rect class="box" x="457" y="338" width="16" height="16"/>
  <rect class="bad" x="477" y="338" width="16" height="16"/>
  <rect class="box" x="497" y="338" width="16" height="16"/>
  <rect class="box" x="517" y="338" width="16" height="16"/>

  <text class="xs" x="360" y="351" text-anchor="middle">sub-hashes</text>
  <text class="m" x="360" y="378" text-anchor="middle">the first subsystem hash that differs is where it split</text>

  <text class="s badt" x="360" y="406" text-anchor="middle">the run halts here</text>
  <text class="m" x="360" y="424" text-anchor="middle">whatever it halts on is the first divergence, by construction</text>

  <text class="m" x="360" y="454" text-anchor="middle">the program counter is deliberately excluded from the compared hash</text>
</svg>
