<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Two wide views. With the original spawn line just past the old 4:3 edge, an enemy in the margin does not exist yet and pops in inside the wide view. With the spawn line moved past the wide edge, the same enemy already exists when it scrolls into view.">
  <style>
    svg { --ink: #76767c; --acc: #cc4b45; --ok: #3f8f5a; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #84848a; --acc: #dc5b55; --ok: #5fb07a; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .h { font-size: 13.5px; font-weight: 600; }
    .s { font-size: 12.5px; font-weight: 600; }
    .m { font-size: 11px; }
    .xs { font-size: 10.5px; }
    .scr { fill: none; stroke: var(--ink); stroke-width: 1.25; }
    .core { fill: var(--ink); fill-opacity: 0.08; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; }
    .badl { stroke: var(--acc); stroke-width: 2; stroke-dasharray: 6 4; }
    .okl { stroke: var(--ok); stroke-width: 2; stroke-dasharray: 6 4; }
    .enemy { fill: var(--ok); }
    .missing { fill: none; stroke: var(--acc); stroke-width: 1.25; stroke-dasharray: 2 2; }
    .acct { fill: var(--acc); }
    .okt { fill: var(--ok); }
  </style>

  <!-- row 1: native bounds -->
  <text class="s" x="16" y="34">Spawn line left</text>
  <text class="s" x="16" y="49">at the 4:3 edge</text>
  <rect class="scr" x="150" y="20" width="440" height="90"/>
  <rect class="core" x="260" y="20" width="220" height="90"/>
  <text class="xs" x="370" y="104" text-anchor="middle">original 4:3 area</text>
  <line class="badl" x1="500" y1="12" x2="500" y2="118"/>
  <text class="m acct" x="500" y="132" text-anchor="middle">spawn line</text>
  <circle class="missing" cx="550" cy="65" r="13"/>
  <text class="m acct" x="604" y="58">not there yet:</text>
  <text class="m acct" x="604" y="72">pops in on screen</text>

  <!-- row 2: widened bounds -->
  <text class="s" x="16" y="184">Spawn line widened</text>
  <text class="s" x="16" y="199">past the wide edge</text>
  <rect class="scr" x="150" y="170" width="440" height="90"/>
  <rect class="core" x="260" y="170" width="220" height="90"/>
  <text class="xs" x="370" y="254" text-anchor="middle">original 4:3 area</text>
  <line class="okl" x1="610" y1="162" x2="610" y2="268"/>
  <text class="m okt" x="610" y="282" text-anchor="middle">spawn line</text>
  <circle class="enemy" cx="550" cy="215" r="13"/>
  <text class="m okt" x="624" y="208">already active</text>
  <text class="m okt" x="624" y="222">when it is seen</text>

  <text class="xs" x="16" y="296">Bosses and scripted encounters keep the original line, so they still start when the player reaches them.</text>
</svg>
