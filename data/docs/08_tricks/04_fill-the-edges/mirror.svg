<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="A row of background columns A to H ends at a hard stage edge. The original screen stops at that edge. A wide view extends past it. The margin columns past the edge show H, G and F again, mirrored from the last real columns. The left margin, still inside the level, shows real map data.">
  <style>
    svg { --ink: #76767c; --acc: #cc4b45; --ok: #3f8f5a; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #84848a; --acc: #dc5b55; --ok: #5fb07a; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .h { font-size: 13.5px; font-weight: 600; }
    .s { font-size: 12.5px; font-weight: 600; }
    .m { font-size: 11px; }
    .xs { font-size: 10.5px; }
    .col { fill: var(--ink); fill-opacity: 0.12; stroke: var(--ink); stroke-width: 1; }
    .mir { fill: var(--ok); fill-opacity: 0.2; stroke: var(--ok); stroke-width: 1; }
    .edge { stroke: var(--acc); stroke-width: 2.5; }
    .acct { fill: var(--acc); }
    .okt { fill: var(--ok); }
    .br { fill: none; stroke: var(--ink); stroke-width: 1.25; }
    .arc { fill: none; stroke: var(--ok); stroke-width: 1.25; stroke-dasharray: 3 3; }
    .letter { font-size: 15px; font-weight: 600; }
  </style>

  <!-- brackets -->
  <path class="br" d="M48,44 L48,36 L576,36 L576,44"/>
  <text class="s" x="312" y="28" text-anchor="middle">wide view</text>
  <path class="br" d="M192,74 L192,66 L432,66 L432,74"/>
  <text class="m" x="312" y="60" text-anchor="middle">original screen, stopped at the edge</text>

  <!-- real columns A..H -->
  <rect class="col" x="48" y="84" width="48" height="80"/><text class="letter" x="72" y="130" text-anchor="middle">A</text>
  <rect class="col" x="96" y="84" width="48" height="80"/><text class="letter" x="120" y="130" text-anchor="middle">B</text>
  <rect class="col" x="144" y="84" width="48" height="80"/><text class="letter" x="168" y="130" text-anchor="middle">C</text>
  <rect class="col" x="192" y="84" width="48" height="80"/><text class="letter" x="216" y="130" text-anchor="middle">D</text>
  <rect class="col" x="240" y="84" width="48" height="80"/><text class="letter" x="264" y="130" text-anchor="middle">E</text>
  <rect class="col" x="288" y="84" width="48" height="80"/><text class="letter" x="312" y="130" text-anchor="middle">F</text>
  <rect class="col" x="336" y="84" width="48" height="80"/><text class="letter" x="360" y="130" text-anchor="middle">G</text>
  <rect class="col" x="384" y="84" width="48" height="80"/><text class="letter" x="408" y="130" text-anchor="middle">H</text>

  <!-- mirrored margin -->
  <rect class="mir" x="432" y="84" width="48" height="80"/><text class="letter okt" x="456" y="130" text-anchor="middle">H</text>
  <rect class="mir" x="480" y="84" width="48" height="80"/><text class="letter okt" x="504" y="130" text-anchor="middle">G</text>
  <rect class="mir" x="528" y="84" width="48" height="80"/><text class="letter okt" x="552" y="130" text-anchor="middle">F</text>

  <line class="edge" x1="432" y1="76" x2="432" y2="172"/>
  <text class="s acct" x="440" y="80">stage edge</text>
  <text class="m" x="590" y="112">no map data</text>
  <text class="m" x="590" y="126">past this edge</text>

  <!-- mirror arcs -->
  <path class="arc" d="M408,166 C408,196 456,196 456,166"/>
  <path class="arc" d="M360,166 C360,214 504,214 504,166"/>
  <path class="arc" d="M312,166 C312,232 552,232 552,166"/>

  <text class="m" x="120" y="186" text-anchor="middle">left margin: real data</text>
  <text class="m okt" x="590" y="200">mirrored from</text>
  <text class="m okt" x="590" y="214">the last real columns</text>
  <text class="xs" x="16" y="258">1 column past the edge shows the last real column, 2 past shows the one before it, and so on.</text>
</svg>
