<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="An open ecosystem for turning code from original console games into modern apps." />
    <title>Retro Porting Toolkit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://retroportingtoolkit.com/" />
    <meta property="og:site_name" content="Retro Porting Toolkit" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Retro Porting Toolkit" />
    <meta property="og:description" content="An open ecosystem for turning code from original console games into modern apps." />
    <meta property="og:url" content="https://retroportingtoolkit.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Retro Porting Toolkit" />
    <meta name="twitter:description" content="An open ecosystem for turning code from original console games into modern apps." />
    <script>
      // Apply the stored theme before first paint so the page never flashes the
      // wrong palette. Mirrors the toggle in src/components/ThemeToggle.tsx.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
